import com.android.build.OutputFile

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Performance Audit finding F5 — react-native-vector-icons bundles all 19
// font families (~3.9MB) by default. Confirmed via a repo-wide grep that
// this app only ever uses MaterialCommunityIcons (through react-native-
// paper's Icon/IconButton, which resolves to that one family internally) —
// no other font is imported/referenced anywhere in src/. Restricting to
// just that one file removes ~2.8MB of genuinely unused fonts.
project.ext.vectoricons = [
    iconFontNames: ["MaterialCommunityIcons.ttf"]
]
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Push notifications (Milestone 8 mobile gap) — google-services.json is
// project-specific and gitignored (not fabricated/portable), so this plugin
// is only applied when the file is actually present. Without it, RNFirebase
// autolinks but has no config to initialize with, and push registration
// fails gracefully (best-effort, same as every other background call in
// this app) instead of the whole build breaking.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 *
 * Performance Audit finding F4 — enabled. Custom keep rules for the
 * reflection-heavy parts of this dependency stack (React Native bridge,
 * Firebase Messaging, react-native-maps) live in proguard-rules.pro.
 * Verified with a real physical-device pass covering login/session restore,
 * GPS, maps, sockets, push, and the full job lifecycle — not assumed safe
 * from a successful build alone.
 */
def enableProguardInReleaseBuilds = true

/**
 * Performance Audit finding F3 — without this, one "universal" APK bundles
 * native .so libraries for all 4 architectures (armeabi-v7a, arm64-v8a, x86,
 * x86_64), which is the single biggest driver of release APK size. Splitting
 * per-ABI is standard and safe for the CURRENT direct-APK-sideloading
 * distribution model (not Play Store, which would otherwise handle this
 * automatically via App Bundles) — universalApk stays true below
 * specifically so a full-architecture fallback APK is still produced
 * alongside the small per-ABI ones, so a tester who installs the wrong
 * per-ABI file (or whose device architecture is unknown) always has a
 * working option, never just an install failure. See
 * android/APK-DISTRIBUTION.md for which file to hand to which device.
 */
def enableSeparateBuildPerCPUArchitecture = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.admillmobile"
    defaultConfig {
        applicationId "com.admillmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            // Also builds one universal (all-architecture) APK alongside the
            // 4 small per-ABI ones — see the comment on
            // enableSeparateBuildPerCPUArchitecture above for why, for this
            // project's direct-sideloading distribution model.
            universalApk true
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
}

// Gives each per-ABI APK a distinct versionCode (offset by architecture) so
// they're unambiguous as separate artifacts — standard practice alongside
// ABI splits (matches React Native's own documented pattern for this
// feature), even though this project doesn't currently upload to a store
// that would enforce it.
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
        def abi = output.getFilter(OutputFile.ABI)
        if (abi != null) {
            output.versionCodeOverride = abiVersionCodes.get(abi) * 1048576 + android.defaultConfig.versionCode
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
